schema: 1
study_id: replace-with-preregistered-study-id
seed: 20260805
repetitions: 10
capture_contents: true
timeout_seconds: 3600

tasks:
  - id: replace-with-task-id
    objective: >-
      Replace this with the complete task given identically to both arms.
    repository:
      url: https://github.com/example/replace-with-external-repository.git
      commit: 0123456789abcdef0123456789abcdef01234567

    # Authored independently of product findings and used for outcome labels.
    hard_constraints:
      - id: preserve-public-api
        statement: Do not change existing public function signatures.
      - id: preserve-tests
        statement: Do not modify existing tests.

    # Prepared before randomisation; this is not the outcome ground truth.
    northstar_contract:
      protected_paths:
        - tests/**
      public_api:
        change: forbidden

    # Every command is an argv array. No implicit shell is used.
    setup:
      - ["{python}", "-m", "pip", "install", "-e", ".[test]"]
    test: ["{python}", "-m", "pytest", "-q"]

agents:
  # Run `northstar live-bench preflight study.yml --check-repositories`
  # before planning or spending agent tokens. It checks these exact version
  # strings and proves every declared commit is fetchable.
  - id: codex-pinned
    host: codex
    # Must equal the complete, stripped output of `codex --version`.
    version: REPLACE_WITH_EXACT_CODEX_VERSION_OUTPUT
    model: REPLACE_WITH_EXACT_CODEX_MODEL
    version_command: ["codex", "--version"]
    # Project hooks are generated by the protected arm after cloning. Bypassing
    # hook trust is appropriate only because the benchmark runner and every input
    # repository have been reviewed before this unattended execution.
    command:
      - codex
      - exec
      - --json
      - --ephemeral
      - --ignore-user-config
      - --enable
      - hooks
      - --sandbox
      - workspace-write
      - --dangerously-bypass-hook-trust
      - --model
      - "{model}"
      - "{prompt}"

  - id: claude-code-pinned
    host: claude-code
    # Must equal the complete, stripped output of `claude --version`.
    version: REPLACE_WITH_EXACT_CLAUDE_CODE_VERSION_OUTPUT
    model: REPLACE_WITH_EXACT_CLAUDE_MODEL
    version_command: ["claude", "--version"]
    command:
      - claude
      - --print
      - --output-format
      - stream-json
      - --verbose
      - --include-hook-events
      - --no-session-persistence
      - --setting-sources
      - project
      - --strict-mcp-config
      - --permission-mode
      - bypassPermissions
      - --model
      - "{model}"
      - "{prompt}"
