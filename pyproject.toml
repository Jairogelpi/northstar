[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-runtime"
version = "0.2.0"
description = "Deterministic invariant enforcement for coding agents with an external integrity authority."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-agents", "coding-agents", "claude-code", "codex", "guardrails", "intent-drift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0", "cryptography>=43"]

[project.urls]
Homepage = "https://github.com/Jairogelpi/northstar"
Repository = "https://github.com/Jairogelpi/northstar"
Issues = "https://github.com/Jairogelpi/northstar/issues"
Changelog = "https://github.com/Jairogelpi/northstar/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Jairogelpi/northstar#readme"

[project.scripts]
northstar = "northstar.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "build>=1.2", "twine>=6.0", "ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["northstar"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
