name: False block
description: Report an action Northstar refused but the reviewed contract should allow.
title: "false block: "
labels: ["false-block", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: False blocks are first-class evidence failures. Please provide the smallest safe reproduction.
  - type: input
    id: version
    attributes:
      label: Northstar version or commit
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Minimal contract
      render: yaml
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Action that was blocked
      description: Include the tool name and relevant payload with secrets removed.
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: Exact verdict
      render: text
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why the contract should allow it
    validations:
      required: true
